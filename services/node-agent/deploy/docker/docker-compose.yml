version: "3.8"

services:
  sentinel:
    image: ghcr.io/niranjanraj345/sentinel:latest
    container_name: sentinel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./sentinel.db:/app/sentinel.db
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
